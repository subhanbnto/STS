<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — STS</title>
  <style>
    :root {
      --bg: #0a0e14;
      --surface: #131920;
      --surface2: #1a2129;
      --border: #2d3748;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --success: #3fb950;
      --danger: #f85149;
      --warn: #d29922;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 0;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      padding: 1rem 1.5rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .header-left {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
    }
    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .logo-sub {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 500;
    }
    .btn-logout {
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      font-weight: 500;
      background: var(--surface2);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: color 0.2s, border-color 0.2s;
    }
    .btn-logout:hover {
      color: var(--text);
      border-color: var(--muted);
    }
    .main { padding: 1.5rem; max-width: 1400px; margin: 0 auto; }
    .grid {
      display: grid;
      gap: 1.25rem;
      grid-template-columns: 1fr 1fr;
    }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      overflow: hidden;
    }
    .card h2 {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .pulse {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse 1.5s ease-in-out infinite;
    }
    .pulse.warn { background: var(--warn); }
    .pulse.danger { background: var(--danger); }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.1); }
    }
    .status-text {
      font-family: ui-monospace, 'SF Mono', monospace;
      font-size: 1rem;
      font-weight: 600;
    }
    .status-detail {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.35rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }
    th, td {
      text-align: left;
      padding: 0.6rem 0.5rem;
      border-bottom: 1px solid var(--border);
    }
    th {
      font-weight: 600;
      color: var(--muted);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    tr:last-child td { border-bottom: 0; }
    tr:hover td { background: rgba(255,255,255,0.02); }
    .side-long { color: var(--success); font-weight: 600; }
    .side-short { color: var(--danger); font-weight: 600; }
    .outcome-ok { color: var(--success); }
    .outcome-fail { color: var(--danger); }
    .insight-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.75rem;
    }
    @media (max-width: 600px) { .insight-grid { grid-template-columns: repeat(2, 1fr); } }
    .insight-box {
      background: var(--surface2);
      border-radius: 10px;
      padding: 1rem;
      text-align: center;
      border: 1px solid var(--border);
    }
    .insight-box .val {
      font-family: ui-monospace, 'SF Mono', monospace;
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--accent);
    }
    .insight-box .lbl {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-top: 0.25rem;
    }
    .empty {
      color: var(--muted);
      font-size: 0.85rem;
      padding: 1.25rem;
      text-align: center;
    }
    .full-width { grid-column: 1 / -1; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-left">
      <span class="logo">STS</span>
      <span class="logo-sub">Signal Trading Software</span>
    </div>
    <a href="/logout" class="btn-logout">Log out</a>
  </header>

  <main class="main">
    <div class="grid">
      <div class="card full-width">
        <h2>Status</h2>
        <div class="status-row">
          <span class="pulse" id="statusPulse"></span>
          <span class="status-text" id="statusText">Connecting…</span>
        </div>
        <div class="status-detail" id="statusDetail"></div>
      </div>

      <div class="card">
        <h2>Insights</h2>
        <div class="insight-grid">
          <div class="insight-box">
            <div class="val" id="insightSignals">0</div>
            <div class="lbl">Signals</div>
          </div>
          <div class="insight-box">
            <div class="val" id="insightActive">0</div>
            <div class="lbl">Active</div>
          </div>
          <div class="insight-box">
            <div class="val" id="insightSuccess">0</div>
            <div class="lbl">Success</div>
          </div>
          <div class="insight-box">
            <div class="val" id="insightFail">0</div>
            <div class="lbl">Failed</div>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>Recent signals</h2>
        <div id="signalsTable">
          <table>
            <thead>
              <tr><th>Time</th><th>Symbol</th><th>Side</th><th>Size</th><th>TP</th></tr>
            </thead>
            <tbody id="signalsBody"></tbody>
          </table>
          <div class="empty" id="signalsEmpty">No signals yet</div>
        </div>
      </div>

      <div class="card">
        <h2>Active trades</h2>
        <div id="activeTable">
          <table>
            <thead>
              <tr><th>Time</th><th>Symbol</th><th>Side</th><th>Size</th><th>Status</th></tr>
            </thead>
            <tbody id="activeBody"></tbody>
          </table>
          <div class="empty" id="activeEmpty">No active trades</div>
        </div>
      </div>

      <div class="card full-width">
        <h2>Closed / outcome</h2>
        <div id="closedTable">
          <table>
            <thead>
              <tr><th>Time</th><th>Symbol</th><th>Side</th><th>Size</th><th>Outcome</th><th>Message</th></tr>
            </thead>
            <tbody id="closedBody"></tbody>
          </table>
          <div class="empty" id="closedEmpty">No closed trades yet</div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const API = '/api/status';
    function escapeHtml(s) {
      if (s == null) return '';
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }
    function render() {
      fetch(API, { credentials: 'same-origin' }).then(r => {
        if (r.status === 401) { window.location.href = '/login'; return; }
        return r.json();
      }).then(data => {
        if (!data) return;
        document.getElementById('statusText').textContent = data.status || 'Waiting for signal…';
        document.getElementById('statusDetail').textContent = data.status_detail || '';
        const pulse = document.getElementById('statusPulse');
        if ((data.status || '').toLowerCase().includes('wait')) {
          pulse.className = 'pulse warn';
        } else if ((data.status || '').toLowerCase().includes('fail')) {
          pulse.className = 'pulse danger';
        } else {
          pulse.className = 'pulse';
        }

        const i = data.insights || {};
        document.getElementById('insightSignals').textContent = i.signals_today ?? 0;
        document.getElementById('insightActive').textContent = i.active_count ?? 0;
        document.getElementById('insightSuccess').textContent = i.success_count ?? 0;
        document.getElementById('insightFail').textContent = i.fail_count ?? 0;

        const signals = data.signals || [];
        const signalsBody = document.getElementById('signalsBody');
        const signalsEmpty = document.getElementById('signalsEmpty');
        signalsBody.innerHTML = signals.slice(0, 10).map(s => `
          <tr>
            <td>${escapeHtml(s.time)}</td>
            <td>${escapeHtml(s.symbol)}</td>
            <td class="side-${s.side === 'long' ? 'long' : 'short'}">${escapeHtml(s.side)}</td>
            <td>${s.size_usdt != null ? s.size_usdt : '—'}</td>
            <td>${s.take_profit != null ? s.take_profit : '—'}</td>
          </tr>
        `).join('');
        signalsEmpty.style.display = signals.length ? 'none' : 'block';

        const active = data.trades_active || [];
        const activeBody = document.getElementById('activeBody');
        const activeEmpty = document.getElementById('activeEmpty');
        activeBody.innerHTML = active.slice(0, 15).map(t => `
          <tr>
            <td>${escapeHtml(t.time)}</td>
            <td>${escapeHtml(t.symbol)}</td>
            <td class="side-${t.side === 'LONG' || t.side === 'long' ? 'long' : 'short'}">${escapeHtml(t.side)}</td>
            <td>${t.size != null ? t.size : ''} / ${t.size_usdt != null ? t.size_usdt : ''} USDT</td>
            <td class="outcome-ok">Placed</td>
          </tr>
        `).join('');
        activeEmpty.style.display = active.length ? 'none' : 'block';

        const closed = data.trades_closed || [];
        const closedBody = document.getElementById('closedBody');
        const closedEmpty = document.getElementById('closedEmpty');
        closedBody.innerHTML = closed.slice(0, 20).map(t => {
          const ok = t.outcome === 'success' || t.success === true;
          return `<tr>
            <td>${escapeHtml(t.time)}</td>
            <td>${escapeHtml(t.symbol)}</td>
            <td class="side-${t.side === 'LONG' || t.side === 'long' ? 'long' : 'short'}">${escapeHtml(t.side)}</td>
            <td>${t.size != null ? t.size : ''}</td>
            <td class="${ok ? 'outcome-ok' : 'outcome-fail'}">${ok ? 'Success' : 'Failed'}</td>
            <td>${escapeHtml(t.message || t.closed_message || '')}</td>
          </tr>`;
        }).join('');
        closedEmpty.style.display = closed.length ? 'none' : 'block';
      }).catch(() => {
        document.getElementById('statusText').textContent = 'Dashboard offline';
        document.getElementById('statusPulse').className = 'pulse danger';
      });
    }
    render();
    setInterval(render, 2000);
  </script>
</body>
</html>
